<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | CellStore</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="pagina-auth">
    <main class="auth-caja">
        <a href="index.html" class="logo">CellStore<span>.</span></a>

        <h1>Crea tu cuenta</h1>
        <p class="auth-sub">Regístrate para comprar y guardar tus pedidos.</p>

        <form id="formulario" class="auth-form">
            <label for="nombre">Nombre</label>
            <input id="nombre" placeholder="Tu nombre completo" required>

            <label for="email">Correo</label>
            <input id="email" type="email" placeholder="tucorreo@correo.com" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="Crea una contraseña" required>

            <button type="submit" class="boton">Registrarme</button>
            <p id="msg" class="auth-msg"></p>
        </form>

        <p class="auth-enlace">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        <a href="index.html" class="auth-volver">← Volver a la tienda</a>
    </main>

    <script>
    document.getElementById('formulario').addEventListener('submit', async e => {
        e.preventDefault();
        const msg = document.getElementById('msg');
        msg.textContent = '';

        try {
            const res = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: document.getElementById('nombre').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();

            if (res.ok) location.href = 'login.html';
            else msg.textContent = data.error;
        } catch {
            msg.textContent = 'No se pudo conectar con el servidor.';
        }
    });
    </script>
</body>
</html>
